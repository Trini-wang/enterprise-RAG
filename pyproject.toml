[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "X4tar", email = "x4tar@foxmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=23.1.0",
    "cryptography>=43.0.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.6",
    "SQLAlchemy>=2.0.0",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
enterprise-rag = "enterprise_rag:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
